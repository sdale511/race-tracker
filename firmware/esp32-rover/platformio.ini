; ESP32-S3 rover firmware - see README.md. `pio run` builds the default board, `pio test -e native` runs the host tests
; (lib/rover_core against vectors generated from the Node code by tools/gen_vectors.js).

[platformio]
default_envs = feather_s3_nopsram

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[esp32]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; ROVER_BUILD: the status hello's build number (the Node rover sends its git commit count)
  -DROVER_BUILD=0

; Adafruit ESP32-S3 Feather, 8 MB flash, no PSRAM (#5323)
[env:feather_s3_nopsram]
extends = esp32
board = adafruit_feather_esp32s3_nopsram

; Adafruit ESP32-S3 Feather, 4 MB flash, 2 MB PSRAM (#5477)
[env:feather_s3]
extends = esp32
board = adafruit_feather_esp32s3

; Adafruit ESP32-S3 Reverse TFT Feather (#5691) - the screen is not used yet
[env:feather_s3_reversetft]
extends = esp32
board = adafruit_feather_esp32s3_reversetft

; Host tests: no Arduino, just lib/rover_core
[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -DUNIT_TEST -Wall
