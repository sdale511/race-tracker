<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The on-grid zone is a box along the leeward side of the pin-to-committee line, with a right triangle cut from the committee corner: hypotenuse starting at committee, running 40 degrees down from the start line to the far edge of the zone, cutting off the entire bottom-right corner of the box.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8492a" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#55686d" stroke-width="1" opacity="0.6" />
    </pattern>
  </defs>

  <rect width="620" height="400" fill="#ffffff" />

  <!-- valid leeward box (below the line only) -->
  <rect x="90" y="130" width="310" height="90" fill="#2f669014" />
  <text x="150" y="150" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#2f6690">on-grid zone (leeward only)</text>
  <text x="150" y="166" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#55686d">width: pin&#8596;committee (~61m) &#183; depth: REGATTAUP_ONGRID_ZONE_M (10m)</text>

  <!-- windward side, explicitly excluded -->
  <text x="245" y="70" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">windward side &#8212; excluded outright (OCS side)</text>
  <line x1="245" y1="82" x2="245" y2="120" stroke="#8a9a97" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow)" />

  <!-- start line, continuing on toward finish past committee -->
  <line x1="90" y1="130" x2="480" y2="130" stroke="#1b2a2f" stroke-width="1.5" />
  <text x="485" y="134" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">&#8594; finish</text>
  <circle cx="90" cy="130" r="6" fill="#1b2a2f" />
  <circle cx="400" cy="130" r="6" fill="#c8492a" />
  <text x="90" y="116" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1b2a2f">pin</text>
  <text x="396" y="116" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c8492a">committee</text>

  <!-- right triangle: hypotenuse from committee, 40deg down from the start
       line, to the far edge of the zone; right angle at the box's own
       bottom-right corner -->
  <path d="M 400,130 L 400,220 L 293,220 Z" fill="url(#hatch)" stroke="#1b2a2f" stroke-width="0.75" stroke-dasharray="2 3" />
  <line x1="365" y1="175" x2="416" y2="195" stroke="#8a9a97" stroke-width="1" />
  <text x="420" y="197" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">starboard-tack triangle</text>
  <text x="420" y="211" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">hyp. 40&#176; off start line</text>

  <!-- dimension callouts for the triangle's own legs -->
  <line x1="410" y1="130" x2="410" y2="220" stroke="#8a9a97" stroke-width="1" />
  <text x="414" y="178" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#55686d">10m</text>
  <line x1="293" y1="234" x2="400" y2="234" stroke="#8a9a97" stroke-width="1" />
  <text x="346" y="250" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#55686d">11.92m</text>

  <!-- ghost finish-approach track through the triangle -->
  <path d="M 175,370 C 230,320 290,260 340,205" fill="none" stroke="#c8492a99" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="130" y="386" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">finishing boat, starboard tack &#8212; never counted on-grid</text>

  <!-- genuine on-grid boat -->
  <circle cx="140" cy="195" r="5" fill="#2f6690" />
  <text x="152" y="199" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#2f6690">queuing boat</text>
</svg>
