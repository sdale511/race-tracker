<svg viewBox="0 0 660 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The on-grid zone is a box along the leeward side of the pin-to-committee line, with a right triangle cut from EACH end: one hypotenuse starting at committee, the other at pin, each running 55 degrees down from the start line to the far edge of the zone, cutting off both bottom corners of the box.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8492a" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#55686d" stroke-width="1" opacity="0.6" />
    </pattern>
  </defs>

  <rect width="660" height="480" fill="#ffffff" />

  <!-- valid leeward box (below the line only) -->
  <rect x="90" y="130" width="310" height="90" fill="#2f669014" />
  <text x="165" y="150" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#2f6690">on-grid zone (leeward only)</text>
  <text x="165" y="166" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#55686d">width: pin&#8596;committee (~61m) &#183; depth: REGATTAUP_ONGRID_ZONE_M (10m)</text>

  <!-- windward side, explicitly excluded -->
  <text x="245" y="70" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">windward side &#8212; excluded outright (OCS side)</text>
  <line x1="245" y1="82" x2="245" y2="120" stroke="#8a9a97" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow)" />

  <!-- start line, continuing on toward finish past committee -->
  <line x1="90" y1="130" x2="480" y2="130" stroke="#1b2a2f" stroke-width="1.5" />
  <text x="485" y="134" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">&#8594; finish</text>
  <circle cx="90" cy="130" r="6" fill="#1b2a2f" />
  <circle cx="400" cy="130" r="6" fill="#c8492a" />
  <text x="90" y="116" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1b2a2f">pin</text>
  <text x="396" y="116" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c8492a">committee</text>

  <!-- right triangle at the COMMITTEE corner: hypotenuse from committee,
       55deg down from the start line, to the far edge of the zone; right
       angle at the box's own bottom-right corner -->
  <path d="M 400,130 L 400,220 L 337,220 Z" fill="url(#hatch)" stroke="#1b2a2f" stroke-width="0.75" stroke-dasharray="2 3" />

  <!-- right triangle at the PIN corner: mirror image, hypotenuse from pin,
       55deg down from the start line, to the far edge of the zone -->
  <path d="M 90,130 L 90,220 L 153,220 Z" fill="url(#hatch)" stroke="#1b2a2f" stroke-width="0.75" stroke-dasharray="2 3" />

  <circle cx="245" cy="195" r="5" fill="#2f6690" />
  <text x="257" y="199" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#2f6690">queuing boat</text>

  <!-- dimension callouts for the triangles' own legs -->
  <line x1="410" y1="130" x2="410" y2="220" stroke="#8a9a97" stroke-width="1" />
  <text x="414" y="178" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#55686d">10m</text>
  <line x1="337" y1="234" x2="400" y2="234" stroke="#8a9a97" stroke-width="1" />
  <text x="368" y="250" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#55686d">7.0m</text>
  <line x1="90" y1="234" x2="153" y2="234" stroke="#8a9a97" stroke-width="1" />
  <text x="121" y="250" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#55686d">7.0m</text>

  <!-- legend: what each cut corner is and when it applies -->
  <text x="90" y="286" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#1b2a2f">port-tack triangle (pin corner) &#8212; hyp. 55&#176; off start line. Always on, no gate.</text>
  <text x="90" y="316" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#1b2a2f">starboard-tack triangle (committee corner) &#8212; hyp. 55&#176; off start line.</text>
  <text x="90" y="334" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#1b2a2f">Only counted when committeeFinish sits close to committeeStart.</text>

  <!-- ghost downwind track through the pin triangle -->
  <path d="M 70,430 C 85,380 100,300 108,210" fill="none" stroke="#c8492a99" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="10" y="450" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">sailing downwind past pin &#8212; never counted on-grid</text>

  <!-- ghost finish-approach track through the committee triangle -->
  <path d="M 420,430 C 405,380 400,300 396,210" fill="none" stroke="#c8492a99" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="260" y="470" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">finishing boat, starboard tack &#8212; never counted on-grid</text>
</svg>
