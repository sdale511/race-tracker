<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>1 second versus 2 second RTCM interval, same scale</title><desc>Two timelines at the same scale. With corrections every 1 second there are 20 slots: 17 for boats, 2 join and 1 base. With corrections every 2 seconds there are 42: 39 for boats, 2 join and 1 base.</desc><rect width="680" height="300" fill="#ffffff"/>
<text x="40" y="32" text-anchor="start" font-size="14" font-weight="500" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1 s interval</text>
<text x="190" y="32" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">20 slots: 17 boats + 2 join + 1 base</text>
<rect x="40" y="44" width="9" height="34" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="49" y="44" width="229.5" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="163.75" y="61" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">17 boat slots</text>
<rect x="278.5" y="44" width="27" height="34" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<rect x="305.5" y="44" width="13.5" height="34" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="319" y="44" width="21" height="34" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340" y="96" text-anchor="end" font-size="11" font-weight="400" fill="#5F5E5A" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">next burst at 1000 ms</text>
<text x="40" y="148" text-anchor="start" font-size="14" font-weight="500" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2 s interval (default)</text>
<text x="190" y="148" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">42 slots: 39 boats + 2 join + 1 base</text>
<rect x="40" y="160" width="9" height="34" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="49" y="160" width="526.5" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="312.25" y="177" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">39 boat slots</text>
<rect x="575.5" y="160" width="27" height="34" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<rect x="602.5" y="160" width="13.5" height="34" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="616" y="160" width="24" height="34" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="640" y="212" text-anchor="end" font-size="11" font-weight="400" fill="#5F5E5A" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">next burst at 2000 ms</text>
<text x="40" y="262" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Same time scale; slots are 45 ms wide at both intervals.</text>
<text x="40" y="280" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each boat sends once per cycle: once a second at 1 s, once every 2 s at 2 s.</text>
</svg>
