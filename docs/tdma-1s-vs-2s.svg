<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>1 second versus 2 second RTCM interval, same scale</title><desc>Two timelines at the same scale. With corrections every 1 second there are 26 slots: 23 for boats, 2 join and 1 base. With corrections every 2 seconds there are 54: 51 for boats, 2 join and 1 base.</desc><defs><pattern id="tk" width="10.5" height="34" patternUnits="userSpaceOnUse" x="49"><line x1="0" y1="0" x2="0" y2="34" stroke="#ffffff" stroke-width="1"/></pattern></defs><rect width="680" height="300" fill="#ffffff"/>
<text x="40" y="40" text-anchor="start" font-size="14" font-weight="500" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1 s interval (default)</text>
<text x="190" y="40" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">26 slots: 23 boats + 2 join + 1 base</text>
<rect x="40" y="52" width="9" height="34" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="49" y="52" width="241.5" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="49" y="52" width="241.5" height="34" fill="url(#tk)"/>
<text x="169.75" y="69" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">23 boat slots</text>
<rect x="290.5" y="52" width="21" height="34" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<rect x="311.5" y="52" width="10.5" height="34" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="322" y="52" width="18" height="34" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="40" y="104" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">0</text>
<text x="340" y="104" text-anchor="middle" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1 s</text>
<text x="360" y="62" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each boat sends once per cycle,</text>
<text x="360" y="78" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">every 1 s: up to 8 fixes (8 Hz).</text>
<text x="360" y="94" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Corrections arrive every 1 s.</text>
<text x="40" y="140" text-anchor="start" font-size="14" font-weight="500" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2 s interval</text>
<text x="150" y="140" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">54 slots: 51 boats + 2 join + 1 base</text>
<rect x="40" y="152" width="9" height="34" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="49" y="152" width="535.5" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="49" y="152" width="535.5" height="34" fill="url(#tk)"/>
<text x="316.75" y="169" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">51 boat slots</text>
<rect x="584.5" y="152" width="21" height="34" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<rect x="605.5" y="152" width="10.5" height="34" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="616" y="152" width="24" height="34" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="40" y="204" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">0</text>
<text x="340" y="204" text-anchor="middle" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1 s</text>
<text x="640" y="204" text-anchor="end" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2 s</text>
<text x="40" y="226" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each boat sends once per cycle, every 2 s: up to 8 fixes (4 Hz).</text>
<text x="40" y="242" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Over twice the boat slots, but corrections arrive every 2 s.</text>
<rect x="40" y="266" width="12" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="58" y="272" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">RTCM burst</text>
<rect x="150" y="266" width="12" height="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="168" y="272" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">Boat slots</text>
<rect x="250" y="266" width="12" height="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="268" y="272" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">Join slots</text>
<rect x="350" y="266" width="12" height="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="368" y="272" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">Base slot</text>
<rect x="450" y="266" width="12" height="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="468" y="272" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">Blocked before the burst</text>
</svg>
