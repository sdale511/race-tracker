<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A boat's track loops through a radius around windwardGreen, sweeping through a wide turning angle before exiting - a genuine rounding. A boat transiting past the same mark on a straight tack barely turns at all while inside the same radius.">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8492a" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55686d" />
    </marker>
  </defs>

  <rect width="560" height="320" fill="#ffffff" />

  <!-- rounding radius -->
  <circle cx="170" cy="160" r="70" fill="none" stroke="#1b2a2f" stroke-width="1.5" stroke-dasharray="4 5" />
  <circle cx="170" cy="160" r="6" fill="#2f6690" />
  <text x="182" y="146" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1b2a2f">windwardGreen</text>
  <text x="280" y="30" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">dashed circle: rounding radius (REGATTAUP_MARK_ROUNDING_EXTENSION_M)</text>

  <!-- genuine rounding: sweeps ~125deg inside the radius -->
  <path d="M 108,232 C 130,205 138,178 148,158 C 160,134 185,120 215,124 C 240,127 252,148 246,168"
        fill="none" stroke="#c8492a" stroke-width="2.5" />
  <path d="M 246,168 L 258,196" fill="none" stroke="#c8492a" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <text x="95" y="270" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c8492a">genuine rounding</text>
  <text x="95" y="283" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c8492a">(~125deg turn)</text>

  <!-- transit: straight-ish track through the same radius, barely turning -->
  <circle cx="380" cy="160" r="70" fill="none" stroke="#1b2a2f" stroke-width="1.5" stroke-dasharray="4 5" />
  <circle cx="380" cy="160" r="6" fill="#2f6690" />
  <text x="392" y="146" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1b2a2f">windwardGreen</text>

  <path d="M 335,225 C 350,205 362,185 372,165 C 382,145 394,130 415,115"
        fill="none" stroke="#55686d" stroke-width="2.5" />
  <path d="M 415,115 L 426,98" fill="none" stroke="#55686d" stroke-width="2.5" marker-end="url(#arrowGray)" />
  <text x="330" y="270" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">transit past the mark</text>
  <text x="330" y="283" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">(&lt;80deg turn - not counted)</text>
</svg>
