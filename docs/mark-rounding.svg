<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A virtual gate extends from just behind windwardGreen to well beyond it, along the axis toward leewardGreen; a boat's track loops around the mark and crosses the gate to register a rounding.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8492a" />
    </marker>
  </defs>

  <rect width="560" height="320" fill="#ffffff" />

  <!-- axis reference -->
  <line x1="280" y1="200" x2="280" y2="290" stroke="#2f6690" stroke-width="1" stroke-dasharray="3 4" />
  <text x="288" y="284" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#2f6690">axis toward leewardGreen</text>

  <!-- gate: back margin (short) + forward extension (long) -->
  <line x1="280" y1="200" x2="280" y2="180" stroke="#1b2a2f" stroke-width="3" />
  <line x1="280" y1="180" x2="280" y2="60" stroke="#1b2a2f" stroke-width="3" />
  <text x="220" y="196" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">back margin, 10m fixed</text>
  <text x="220" y="70" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">forward extension, capped short of the outer mark</text>

  <!-- mark -->
  <circle cx="280" cy="180" r="6" fill="#2f6690" />
  <text x="292" y="184" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1b2a2f">windwardGreen</text>

  <!-- boat track: rounding curve -->
  <path d="M 140,290 C 190,240 220,150 280,130 C 330,112 370,150 400,210" fill="none" stroke="#c8492a" stroke-width="2.5" />
  <path d="M 400,210 L 420,250" fill="none" stroke="#c8492a" stroke-width="2.5" marker-end="url(#arrow)" />
  <circle cx="322" cy="118.6" r="5" fill="#c8492a" />
  <text x="332" y="115" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c8492a">crosses the gate here</text>
  <text x="140" y="304" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">approach, upwind</text>
  <text x="420" y="266" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#55686d">departure, downwind</text>
</svg>
