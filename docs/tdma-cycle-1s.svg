<rect x="583" y="100" width="21" height="36" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="593.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#3C3489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">B</text>
<rect x="604" y="100" width="36" height="36" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<line x1="58" y1="146" x2="541" y2="146" stroke="#5f5e5a" stroke-width="0.8"/>
<line x1="58" y1="142" x2="58" y2="150" stroke="#5f5e5a" stroke-width="0.8"/>
<line x1="541" y1="142" x2="541" y2="150" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="300" y="166" text-anchor="middle" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Boat slots 0–22: given to boats as they start reporting (35 ms each)</text>
<line x1="593" y1="140" x2="593" y2="180" stroke="#888780" stroke-width="0.8"/>
<text x="610" y="194" text-anchor="end" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Base slot: table, marks, pings, wake</text>
<line x1="622" y1="140" x2="622" y2="214" stroke="#888780" stroke-width="0.8"/>
<text x="640" y="230" text-anchor="end" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Blocked before the next burst (60 ms)</text>
</svg>
