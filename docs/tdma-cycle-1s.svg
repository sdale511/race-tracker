<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img"><title>One 1 second cycle of the TDMA slot schedule</title><desc>A timeline from one RTCM correction burst to the next: a burst and guard, 23 boat slots, 2 shared join slots, the base slot, then a blocked period before the next burst.</desc><rect width="680" height="260" fill="#ffffff"/>
<text x="40" y="62" text-anchor="start" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">RTCM burst + guard (0–30 ms)</text>
<line x1="49" y1="68" x2="49" y2="100" stroke="#888780" stroke-width="0.8"/>
<text x="600" y="62" text-anchor="end" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2 join slots: boats with no slot yet</text>
<line x1="562" y1="68" x2="562" y2="100" stroke="#888780" stroke-width="0.8"/>
<text x="640" y="88" text-anchor="end" font-size="12" font-weight="400" fill="#2c2c2a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">next burst at 1000 ms</text>
<rect x="40" y="100" width="18" height="36" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="58" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="68.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">0</text>
<rect x="79" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="89.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">1</text>
<rect x="100" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="110.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">2</text>
<rect x="121" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="131.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">3</text>
<rect x="142" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="152.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">4</text>
<rect x="163" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="173.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">5</text>
<rect x="478" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="488.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">20</text>
<rect x="499" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="509.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">21</text>
<rect x="520" y="100" width="21" height="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="530.5" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#085041" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">22</text>
<text x="331" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#5f5e5a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" dominant-baseline="central">· · ·  slots 6–19  · · ·</text>
<rect x="541" y="100" width="21" height="36" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
